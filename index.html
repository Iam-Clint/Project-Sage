<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111015" />
    <script>try{const t=localStorage.getItem('sage-theme');const theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme}catch{}</script>
    <meta name="description" content="SAGE helps Nigerian secondary-school students understand concepts, practise with feedback, and build confidence for WAEC." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SAGE — A little wiser, every day.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
